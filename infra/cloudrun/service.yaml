apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: swarm-os-api
  namespace: default
  labels:
    cloud.googleapis.com/location: europe-west2
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: swarm-api@gdm-hacks2603-lon-2812.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: europe-west2-docker.pkg.dev/gdm-hacks2603-lon-2812/swarm-os/api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: GCP_PROJECT_ID
              value: gdm-hacks2603-lon-2812
            - name: GCP_REGION
              value: europe-west2
            - name: WORKSPACE_ROOT
              value: /tmp/swarm-os-gcp/workspaces
            - name: AUTO_KILL_DEFAULT
              value: "30"
            - name: EXEC_TIMEOUT
              value: "300"
            - name: GKE_MODE
              value: "true"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
