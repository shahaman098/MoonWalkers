apiVersion: v1
kind: Pod
metadata:
  # Name is templated at runtime: "ws-{workspace_id}"
  name: ws-WORKSPACE_ID_PLACEHOLDER
  labels:
    app: swarm-agent
    component: workspace
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  # GKE Autopilot manages node provisioning automatically
  serviceAccountName: swarm-worker-ksa
  activeDeadlineSeconds: 1800  # 30 minutes hard kill (matches AUTO_KILL_DEFAULT)
  restartPolicy: Never

  containers:
    - name: agent-runtime
      image: europe-west2-docker.pkg.dev/gdm-hacks2603-lon-2812/swarm-os/agent-runtime:latest
      ports:
        - containerPort: 8080
          name: api
        - containerPort: 6080
          name: novnc
        - containerPort: 5900
          name: vnc
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      env:
        - name: WORKSPACE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AUTO_KILL_TIMEOUT
          value: "1800"
        - name: SWARM_API_KEY
          valueFrom:
            secretKeyRef:
              name: swarm-secrets
              key: api-key
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # 'agent' user
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: workspace-data
          mountPath: /home/agent/workspace
        - name: tmp
          mountPath: /tmp
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3

  volumes:
    - name: workspace-data
      emptyDir:
        sizeLimit: 5Gi
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
